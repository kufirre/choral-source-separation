# Gate B-lite: Over-separation test with reconstruction-only objective.
#
# This config isolates a SINGLE variable vs the Direct-4 baseline (Gate A):
#   "Does M=10 -> V=4 soft-assignment grouping itself improve SDR?"
#
# Only reconstruction losses are active.
# ALL regularizers and auxiliary modules are OFF to isolate assignment + backbone.
# Homoscedastic weighting is OFF (fixed loss weights, no learned balancing).
#
# Active loss terms (2 total):
#   1. stage2 reconstruction (L1 + multi-resolution STFT)
#   2. stage1 reconstruction (L1 + multi-resolution STFT)
#
# Gate ladder:
#   Gate A: direct-4 baseline         (config_vcin_satb_direct4_baseline.yaml)
#   Gate B: minimal over-sep (this)   — must beat Gate A SDR
#   Gate C: + auxiliary losses         (config_vcin_satb_phase_a_staged.yaml)
#   Gate D: + FiLM / repulsion        — raise weights in staged config
#   Gate E: + CGP / full model        (config_vcin_satb_phase_a_fullpaper.yaml)

audio:
  chunk_size: 132300
  hop_length: 1024
  min_mean_abs: 0.0

training:
  batch_size: 4
  gradient_accumulation_steps: 1
  grad_clip: 0.5
  segment: 11
  shift: 1
  samplerate: 44100
  channels: 2
  normalize: true
  instruments: ['S', 'A', 'T', 'B']
  target_instrument: null
  num_epochs: 8
  num_steps: 60
  optimizer: adamw
  lr: 2.0e-4
  scheduler: constant_with_warmup
  num_warmup_steps: 120      # ~2 epochs warmup for cold assignment start
  patience: 6
  reduce_factor: 0.8
  early_stopping_patience: 24
  q: 0.95
  coarse_loss_clip: true
  max_nonfinite_batches_per_epoch: 5
  min_epoch0_metric: null
  ema_momentum: 0.999
  read_metadata_procs: 8
  other_fix: false
  use_amp: true
  amp_dtype: bfloat16

optimizer:
  weight_decay: 1.0e-2
  betas: !!python/tuple
  - 0.9
  - 0.95
  eps: 1.0e-8

model:
  dim: 128
  depth: 12
  stereo: true
  num_stems: 4
  num_latent_sources: 10
  num_iterations: 1          # K=1: single pass, no iterative feedback
  backbone_type: ts_bsmamba2
  ts_sr: 44100
  ts_win: 2048
  ts_stride: 512
  ts_feature_dim: 128
  ts_num_repeat_mask: 8
  ts_num_repeat_map: 4

  # --- Reconstruction losses (the ONLY signal for separation quality) ---
  stage1_loss_weight: 1.0
  stage2_loss_weight: 1.0
  stft_n_fft: 2048
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false

  # --- Latent regularizers OFF (reconstruction-only ablation) ---
  min_energy_epsilon: 1.0e-4
  min_energy_loss_weight: 0.0
  duplicate_cos_threshold: 0.95
  duplicate_loss_weight: 0.0

  # --- Assignment regularizers OFF (reconstruction-only ablation) ---
  assignment_entropy_weight: 0.0
  assignment_capacity_loss_weight: 0.0
  assignment_capacity_targets: !!python/tuple
  - 0.25
  - 0.25
  - 0.25
  - 0.25

  # --- Everything else is OFF ---
  repulsion_loss_weight: 0.0
  cgp_loss_weight: 0.0
  magnitude_penalty_loss_weight: 0.0
  magnitude_penalty_epsilon: 1.0e-4
  intent_similarity_loss_weight: 0.0
  intent_adversary_loss_weight: 0.0
  intent_gradient_reversal_lambda: 0.1
  pitch_nll_loss_weight: 0.0
  pitch_consistency_loss_weight: 0.0
  voicing_consistency_loss_weight: 0.0
  voicing_entropy_loss_weight: 0.0
  gate_entropy_loss_weight: 0.0
  gate_mean_loss_weight: 0.0
  gate_mean_target: 0.5
  tail_inertia_weight: 0.0

  # NO warmups needed (no auxiliary losses to ramp)
  cgp_warmup_steps: 0
  repulsion_warmup_steps: 0
  magnitude_penalty_warmup_steps: 0
  film_warmup_steps: 0

  # NO homoscedastic weighting — fixed loss weights, no learned balancing
  use_homoscedastic_weighting: false
  homoscedastic_init: 0.0

  # ALL auxiliary modules OFF — saves VRAM, eliminates self-consistency traps
  enable_repulsion: false
  enable_pitch: false
  enable_assignment: true     # required: soft assignment M -> V
  enable_gate: false
  enable_intent: false
  enable_voicing_head: false
  enable_soft_tokenizer: false
  enable_cgp: false
  enable_film: false
  detach_conditioning_before_film: false

  # Module dimensions (only assignment module uses these)
  embed_dim: 64
  pitch_num_components: 3
  dim_head: 64
  heads: 8
  ff_dropout: 0.1
  attn_dropout: 0.1
  flash_attn: true

  # Params accepted by VCINModel but unused with modules off
  time_module_depth: 1
  freq_module_depth: 1
  mask_estimator_depth: 2
  module_type: mamba2
  mamba_gmlp: false

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs:
    !!python/tuple
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5
  all:
    channel_shuffle: 0.5
    random_inverse: 0.1
    random_polarity: 0.5

inference:
  num_overlap: 2
  batch_size: 4
