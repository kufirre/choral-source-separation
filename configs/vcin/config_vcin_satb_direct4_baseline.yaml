# Gate A: Direct-4 production baseline.
# First-class path with strict identity routing (M == V), no over-separation loop.

audio:
  chunk_size: 132300
  hop_length: 1024
  min_mean_abs: 0.0

training:
  model_type: vcin_direct4
  batch_size: 4
  gradient_accumulation_steps: 1
  grad_clip: 0.5
  segment: 11
  shift: 1
  samplerate: 44100
  channels: 2
  normalize: true
  instruments: ['S', 'A', 'T', 'B']
  target_instrument: null
  num_epochs: 120
  num_steps: 300
  optimizer: adamw
  lr: 2.0e-4
  patience: 6
  reduce_factor: 0.8
  early_stopping_patience: 24
  q: 0.95
  coarse_loss_clip: true
  max_nonfinite_batches_per_epoch: 5
  min_epoch0_metric: null
  ema_momentum: 0.999
  read_metadata_procs: 8
  other_fix: false
  use_amp: true
  amp_dtype: bfloat16

optimizer:
  weight_decay: 1.0e-2
  betas: !!python/tuple
  - 0.9
  - 0.95
  eps: 1.0e-8

model:
  dim: 128
  depth: 12
  stereo: true
  num_stems: 4
  num_latent_sources: 4
  backbone_type: ts_bsmamba2
  ts_sr: 44100
  ts_win: 2048
  ts_stride: 512
  ts_feature_dim: 128
  ts_num_repeat_mask: 8
  ts_num_repeat_map: 4
  stage1_loss_weight: 1.0
  stage2_loss_weight: 1.0
  stft_n_fft: 2048
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs:
    !!python/tuple
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5
  all:
    channel_shuffle: 0.5
    random_inverse: 0.1
    random_polarity: 0.5

inference:
  num_overlap: 2
  batch_size: 4
